groups:
  - name: incident-response-platform
    rules:
      - alert: IncidentResponseBackendDown
        expr: up{job="incident-response-backend"} == 0
        for: 2m
        labels:
          severity: critical
          service: incident-response-backend
        annotations:
          summary: Incident Response backend is down
          description: Prometheus cannot scrape the backend /metrics endpoint for 2 minutes.

      - alert: IncidentResponseHigh5xxRate
        expr: sum(rate(incident_response_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(incident_response_http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
          service: incident-response-backend
        annotations:
          summary: Elevated 5xx rate on Incident Response API
          description: More than 5% of API requests have been returning 5xx over the last 10 minutes.

      - alert: IncidentResponseDeadLetterGrowth
        expr: increase(incident_response_workflow_job_retries_total{status=~".*dead_letter.*|dead_letter"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
          service: incident-response-worker
        annotations:
          summary: Workflow jobs are reaching the dead letter queue
          description: At least one workflow job moved to the dead letter queue in the last 15 minutes.

      - alert: IncidentResponseFeedbackIngestFailures
        expr: increase(incident_response_feedback_ingest_total{status="failed"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
          service: incident-response-backend
        annotations:
          summary: Manual feedback ingestion is failing
          description: Feedback ingest failures were observed in the last 15 minutes.

      - alert: IncidentResponseWorkflowFailureRate
        expr: sum(rate(incident_response_workflow_runs_total{workflow_status="failed"}[15m])) / clamp_min(sum(rate(incident_response_workflow_runs_total[15m])), 0.001) > 0.2
        for: 10m
        labels:
          severity: warning
          service: incident-response-worker
        annotations:
          summary: Workflow failure rate is elevated
          description: More than 20% of workflows have failed over the last 15 minutes.
