name: CI

on:
  push:
    branches:
      - main
      - master
      - "release/**"
  pull_request:

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: incident_response
          POSTGRES_USER: incident_user
          POSTGRES_PASSWORD: incident_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident_user -d incident_response"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_DATABASE_URL: postgresql+asyncpg://incident_user:incident_password@127.0.0.1:5432/incident_response
      APP_REDIS_URL: redis://127.0.0.1:6379/0
      APP_AUTO_CREATE_SCHEMA: "false"
      APP_ADMIN_API_TOKEN: admin-token
      APP_API_KEY_PEPPER: ci-pepper-value-12345
      APP_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      APP_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run Alembic migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
