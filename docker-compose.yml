services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incident_response}
      POSTGRES_USER: ${POSTGRES_USER:-incident_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incident_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incident_user} -d ${POSTGRES_DB:-incident_response}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-incident-redis-password}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-incident-redis-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: ./backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file:
      - ./backend/.env
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-incident_user}:${POSTGRES_PASSWORD:-incident_password}@postgres:5432/${POSTGRES_DB:-incident_response}
      APP_AUTO_CREATE_SCHEMA: "false"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      APP_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      APP_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:-127.0.0.1,localhost}
      APP_OPERATIONS_MODE: ${APP_OPERATIONS_MODE:-demo}
      APP_ADMIN_API_TOKEN: ${APP_ADMIN_API_TOKEN:-}
      APP_API_KEY_PEPPER: ${APP_API_KEY_PEPPER:-local-dev-pepper}
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-incident_user}:${POSTGRES_PASSWORD:-incident_password}@postgres:5432/${POSTGRES_DB:-incident_response}
      APP_AUTO_CREATE_SCHEMA: ${APP_AUTO_CREATE_SCHEMA:-true}
      APP_REDIS_URL: redis://:${REDIS_PASSWORD:-incident-redis-password}@redis:6379/0
      APP_MAX_REQUEST_BODY_BYTES: ${APP_MAX_REQUEST_BODY_BYTES:-1000000}
      APP_RATE_LIMIT_ENABLED: ${APP_RATE_LIMIT_ENABLED:-true}
      APP_RATE_LIMIT_REQUESTS: ${APP_RATE_LIMIT_REQUESTS:-300}
      APP_RATE_LIMIT_WINDOW_SECONDS: ${APP_RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.job_worker"]
    env_file:
      - ./backend/.env
    environment:
      APP_OPERATIONS_MODE: ${APP_OPERATIONS_MODE:-demo}
      APP_ADMIN_API_TOKEN: ${APP_ADMIN_API_TOKEN:-}
      APP_API_KEY_PEPPER: ${APP_API_KEY_PEPPER:-local-dev-pepper}
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-incident_user}:${POSTGRES_PASSWORD:-incident_password}@postgres:5432/${POSTGRES_DB:-incident_response}
      APP_AUTO_CREATE_SCHEMA: ${APP_AUTO_CREATE_SCHEMA:-true}
      APP_REDIS_URL: redis://:${REDIS_PASSWORD:-incident-redis-password}@redis:6379/0
      APP_MAX_REQUEST_BODY_BYTES: ${APP_MAX_REQUEST_BODY_BYTES:-1000000}
      APP_RATE_LIMIT_ENABLED: ${APP_RATE_LIMIT_ENABLED:-true}
      APP_RATE_LIMIT_REQUESTS: ${APP_RATE_LIMIT_REQUESTS:-300}
      APP_RATE_LIMIT_WINDOW_SECONDS: ${APP_RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - ./backend/data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_DEMO_API_TOKEN: ${DEMO_API_TOKEN:-}
        VITE_API_TOKEN: ${VITE_API_TOKEN:-}
        VITE_RELEASE_APPROVAL_ID: ${VITE_RELEASE_APPROVAL_ID:-}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      backend:
        condition: service_healthy
      alertmanager:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.1.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
